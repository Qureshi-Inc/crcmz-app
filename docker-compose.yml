services:
  psn-messenger:
    build: .
    environment:
      - NPSSO_TOKEN=${NPSSO_TOKEN}
      - GROUP_ID=${GROUP_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - WA_BRIDGE_URL=${WA_BRIDGE_URL:-}
      - WA_GOOPERS_JID=${WA_GOOPERS_JID:-}
      - CLIP_BUCKET=${CLIP_BUCKET:-}
      - CLIP_S3_ENDPOINT_URL=${CLIP_S3_ENDPOINT_URL:-}
      - GROUP_NAME=${GROUP_NAME:-crcmz-mod}
      - SQUAD_GROUP_NAME=${SQUAD_GROUP_NAME:-The Squad}
      - FFMPEG_TIMEOUT_SECONDS=${FFMPEG_TIMEOUT_SECONDS:-300}
      - MONTAGE_TIMEZONE=${MONTAGE_TIMEZONE:-America/Los_Angeles}
      - PORTAL_PUBLIC_HOST=${PORTAL_PUBLIC_HOST:-psn.crcmz.me}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-https://auth.crcmz.me}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:-}
      - ZITADEL_SERVICE_TOKEN=${ZITADEL_SERVICE_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - WHATSAPP_IMPORT_ALLOWED_ROLE=${WHATSAPP_IMPORT_ALLOWED_ROLE:-IAM Owner Viewer}
      - WA_INGEST_SECRET=${WA_INGEST_SECRET:-}
      - WA_NAME_ALIASES=${WA_NAME_ALIASES:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CLIPS_CHANNEL_ID=${DISCORD_CLIPS_CHANNEL_ID:-}
      # Watch Party — this app brokers identity for the self-hosted WatchParty
      # fork. The PRIVATE key stays here; WatchParty only ever gets the public
      # half. Leave the key unset to auto-generate one into /data/watch.
      - WATCH_AUTH_MODE=${WATCH_AUTH_MODE:-zitadel-ticket}
      - WATCH_TICKET_ISSUER=${WATCH_TICKET_ISSUER:-https://psn.crcmz.me}
      - WATCH_TICKET_AUDIENCE=${WATCH_TICKET_AUDIENCE:-crcmz-watchparty}
      - WATCH_TICKET_PRIVATE_KEY_B64=${WATCH_TICKET_PRIVATE_KEY_B64:-}
      - WATCH_TICKET_TTL_SECONDS=${WATCH_TICKET_TTL_SECONDS:-60}
      - WATCH_ROOMS=${WATCH_ROOMS:-crcmz}
      - WATCHPARTY_ORIGIN=${WATCHPARTY_ORIGIN:-}
      - WATCH_SOCKET_PATH=${WATCH_SOCKET_PATH:-/wp/socket.io}
      # Huddle — LiveKit video chat
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://huddle.crcmz.me}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      # Ollama on the local Mac (server reaches it directly over LAN)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3-turbo}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    volumes:
      - psn_data:/data
    restart: unless-stopped

volumes:
  psn_data:

# The CRCMZ iOS app. Generate the Xcode project with XcodeGen on the Mac:
#   xcodegen generate   (then build with xcodebuild; see README.md)
name: CRCMZ
options:
  bundleIdPrefix: me.crcmz
  deploymentTarget:
    iOS: "16.4"
packages:
  # LiveKit's iOS SDK: Huddle and the Watch Party's camera call run natively (Calls/),
  # so they get picture in picture and keep going with the app in the background.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
settings:
  base:
    DEVELOPMENT_TEAM: CF6R3NUAP7
    # Signed with the build keychain's Apple Distribution certificate and the "CRCMZ App
    # Store" profile (made through the App Store Connect API; see README.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    PROVISIONING_PROFILE_SPECIFIER: CRCMZ App Store
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CRCMZ:
    type: application
    platform: iOS
    sources: [CRCMZ]
    dependencies:
      - package: LiveKit
      - target: CRCMZShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.crcmz.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: CRCMZ App Store
        PRODUCT_NAME: CRCMZ
        INFOPLIST_FILE: CRCMZ/Info.plist
        CODE_SIGN_ENTITLEMENTS: CRCMZ/CRCMZ.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # Share → CRCMZ: a song from Spotify / Apple Music into the Slap library.
  CRCMZShare:
    type: app-extension
    platform: iOS
    sources: [CRCMZShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.crcmz.app.share
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: CRCMZ Share App Store
        PRODUCT_NAME: CRCMZShare
        INFOPLIST_FILE: CRCMZShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CRCMZShare/CRCMZShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
